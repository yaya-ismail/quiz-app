<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="quiz-container">

        <!-- Welcome Screen -->
        <div id="welcome-screen" class="screen">

            <h1>Welcome to Quiz App!</h1>

            <p>Test your knowledge and see how much you know.</p>

            <button id="start-btn">Start Quiz</button>

        </div>


        <!-- Quiz Screen -->
        <div id="quiz-screen" class="screen hidden">

            <div class="quiz-header">

                <h2>General Knowledge Quiz</h2>

                <p id="question-counter">Question 1 of 10</p>

            </div>


            <!-- Progress Bar -->
            <div class="progress-container">

                <div id="progress-bar"></div>

            </div>


            <!-- Question -->
            <h3 id="question">Question will appear here</h3>


            <!-- Answer Options -->
            <div id="answer-buttons" class="answer-buttons">

                <button class="answer-btn">Option A</button>

                <button class="answer-btn">Option B</button>

                <button class="answer-btn">Option C</button>

                <button class="answer-btn">Option D</button>

            </div>


            <!-- Next Button -->
            <button id="next-btn" class="hidden">
                Next Question
            </button>

        </div>


        <!-- Result Screen -->
        <div id="result-screen" class="screen hidden">

            <h1>Quiz Completed!</h1>

            <p>Your final score is:</p>

            <h2 id="score">0 / 10</h2>

            <p id="result-message">
                Great effort! Keep learning.
            </p>

            <button id="restart-btn">
                Play Again
            </button>

        </div>

    </div>


    <!-- Link JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
